# 复制到仓库外的config.yaml，通过HIYORI_CONFIG指定；真实密钥不要提交。
provider: deepseek
api_key: ""  # 环境变量DEEPSEEK_API_KEY优先
model: deepseek-flash
base_url: https://api.deepseek.com
# 使用本机绝对路径；Linux示例：/srv/hiyoribot/data/hiyoribot.sqlite3
sqlite_path: 'E:/unser/q/hiyoribot_flash/hiyoribot.sqlite3'
profile_enabled: true
profile_home: 'E:/unser/q/hiyoribot_flash/profiles'
qq_profile_home: 'E:/unser/q/hiyoribot_flash/profiles'
profile_initial_messages: 20
profile_batch_messages: 50
input_budget_chars: 48000
qq_enabled: false
qq_bot_id: ""
qq_owner_id: ""
qq_backend_token: ""
# 群正文正则；不检查昵称/引用正文。命中直接回复，成功回复后观察后续5条。
# 无时间上限；跟聊10秒冷却，普通群消息仍每50条生成摘要。
qq_name_trigger_patterns:
  - '妃爱'
